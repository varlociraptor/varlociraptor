name: Benchmark

on:
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  benchmark:
    name: Measure speedup vs master
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          path: pr

      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          path: master

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: sudo apt-get install --yes libgsl0-dev zlib1g-dev samtools

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            pr -> target
            master -> target

      - name: Build master binary
        working-directory: master
        run: cargo build --release

      - name: Build PR binary
        working-directory: pr
        run: cargo build --release

      - name: Install hyperfine
        run: sudo apt-get install --yes hyperfine

      - name: Run preprocess variants benchmark
        run: |
          DATA=master/tests/resources/flamegraph_profiling
          hyperfine \
            --warmup 2 \
            --export-markdown /tmp/benchmark-preprocess.md \
            --command-name "master" \
              "master/target/release/varlociraptor preprocess variants $DATA/ref.fa --candidates $DATA/candidates.vcf --bam $DATA/alignment.bam --read-type Annotated > /dev/null" \
            --command-name "PR (${{ github.head_ref }})" \
              "pr/target/release/varlociraptor preprocess variants $DATA/ref.fa --candidates $DATA/candidates.vcf --bam $DATA/alignment.bam --read-type Annotated > /dev/null"

      - name: Run call variants benchmark
        run: |
          DATA=master/tests/resources/flamegraph_profiling
          hyperfine \
            --warmup 2 \
            --export-markdown /tmp/benchmark-call.md \
            --command-name "master" \
              "master/target/release/varlociraptor call variants generic --scenario $DATA/scenario.yaml --obs normal=$DATA/normal.bcf > /dev/null" \
            --command-name "PR (${{ github.head_ref }})" \
              "pr/target/release/varlociraptor call variants generic --scenario $DATA/scenario.yaml --obs normal=$DATA/normal.bcf > /dev/null"

      - name: Post benchmark results as PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const preprocessTable = fs.readFileSync('/tmp/benchmark-preprocess.md', 'utf8');
            const callTable = fs.readFileSync('/tmp/benchmark-call.md', 'utf8');
            const body = [
              '## ⏱ Benchmark Results',
              '',
              '### `preprocess variants`',
              '',
              preprocessTable,
              '',
              '### `call variants`',
              '',
              callTable,
              '',
              '<sub>Data: `tests/resources/flamegraph_profiling`</sub>',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const marker = '## ⏱ Benchmark Results';
            const existing = comments.find(
              c => c.body.startsWith(marker) && c.user.login === 'github-actions[bot]'
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
