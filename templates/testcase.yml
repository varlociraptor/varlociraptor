expected:
  allelefreqs:
    # write down a list of expressions of the form
    - sample_name > 0.45 && sample_name < 0.55
  posteriors:
    # write down a list of expressions of the form
    - PROB_SOMATIC_TUMOR <= 0.05
    - PROB_GERMLINE_HET > 0.05

# necessary bam files
samples:
  {% for (name, sample) in samples -%}
  {{ name }}:
    path: '{{ sample.path }}'
    properties: '{{ sample.properties }}'
    options: '{{ sample.options }}'
  {% endfor %}

# candidate variant
candidate: '{{ candidate }}'

{% if scenario.is_some() -%}
scenario: '{{ scenario.as_ref().unwrap() }}'
{% endif %}

{% if purity.is_some() -%}
purity: {{ purity.unwrap() }}
{% endif %}

# reference sequence
reference:
  path: '{{ ref_path }}'

mode: {{ mode }}

omit_strand_bias: {{ omit_strand_bias }}
omit_read_orientation_bias: {{ omit_read_orientation_bias }}
omit_read_position_bias: {{ omit_read_position_bias }}
omit_softclip_bias: {{ omit_softclip_bias }}
omit_homopolymer_artifact_detection: {{ omit_homopolymer_artifact_detection }}
omit_alt_locus_bias: {{ omit_alt_locus_bias }}
fragment_end_bias: {{ fragment_end_bias }}

version: '4'