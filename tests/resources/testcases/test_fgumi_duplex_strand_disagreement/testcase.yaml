# fgumi duplex consensus reads (simulated, see tests/resources/fgumi-duplex-sim).
# Single-strand damage in F2R1 families of 10 molecules (5 in family A, 5 in family B),
# winning the strand disagreement in the consensus.
# The consensus records of damaged B families have the opposite (F1R2) orientation,
# hence orientation has to be taken from the supporting family to detect the read orientation bias.
expected:
  posteriors:
    - PLAIN_PROB_ARTIFACT > 0.6
    - PLAIN_PROB_SOMATIC < 0.4

# necessary bam files
samples:
  duplex:
    path: 'duplex.bam'
    properties: '{"insert_size":{"mean":297.8981308411215,"sd":38.99857156317264},"max_del_cigar_len":null,"max_ins_cigar_len":null,"frac_max_softclip":null,"max_read_len":150,"max_mapq":60,"gap_params":{"prob_insertion_artifact":-12.785891140783116,"prob_deletion_artifact":-12.186270018233994,"prob_insertion_extend_artifact":null,"prob_deletion_extend_artifact":null},"hop_params":{"prob_seq_homopolymer":[null,null,null,null],"prob_ref_homopolymer":[null,null,null,null],"prob_seq_extend_homopolymer":[null,null,null,null],"prob_ref_extend_homopolymer":[null,null,null,null]},"wildtype_homopolymer_error_model":{"0":1.0},"initial":false}'
