# The pair of test_fgumi_duplex_pair with three more SNVs within 10 bp on the same two molecules (see simulate.sh).
# Each alt read carries three high quality mismatches that only the other alt molecule shares, far below the frequency of germline variation of a diploid.
# Without clustered somatic mutations in the scenario, such a read is more likely from a paralog of low divergence than from a somatic cluster, so the variant is not called.
expected:
  allelefreqs:
    - duplex < 0.01
  posteriors:
    - PLAIN_PROB_SOMATIC < 0.05
    - PLAIN_PROB_ABSENT > 0.9

