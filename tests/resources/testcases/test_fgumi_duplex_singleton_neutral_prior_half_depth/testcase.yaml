# fgumi duplex consensus reads (simulated, see tests/resources/fgumi-duplex-sim).
# True variant in a single duplex molecule among about 190, as in test_fgumi_duplex_singleton.
# With the full prior, the neutral somatic VAF prior has to favor the low VAF (the flat prior yields P(absent) of 0.995).
# test_fgumi_duplex_singleton_neutral_prior with every second reference molecule removed (98 instead of 191 fragments, see simulate.sh): the per-molecule prior gives the single molecule the same posterior at any depth.
expected:
  allelefreqs:
    - duplex > 0.0 && duplex < 0.02
  posteriors:
    - PLAIN_PROB_SOMATIC > 0.65
    - PLAIN_PROB_SOMATIC < 0.85
    - PLAIN_PROB_ABSENT < 0.05

